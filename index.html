<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020617">
  <title>Smart Stock</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      width: 100%; max-width: 360px; padding: 28px 22px; border-radius: 24px;
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); text-align: center;
    }
    .spinner {
      width: 44px; height: 44px; margin: 0 auto 16px;
      border: 4px solid rgba(56, 189, 248, 0.2); border-top-color: #38bdf8;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; margin: 0 0 8px; color: #38bdf8; }
    p { font-size: 13px; color: #cbd5e1; line-height: 1.5; margin: 0 0 16px; }
    .skip {
      display: inline-block; margin-top: 8px; color: #94a3b8;
      font-size: 12px; text-decoration: underline; cursor: pointer; background: none; border: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1 id="statusTitle">กำลังตรวจสอบอุปกรณ์...</h1>
    <p id="statusSub">กรุณารอสักครู่ ระบบกำลังพาเข้าสู่ Smart Stock</p>
    <button class="skip" id="skipBtn" style="display:none;" onclick="redirectToApp(null, null)">เข้าแอปทันทีโดยไม่รอ GPS</button>
  </div>

  <script>
    var TARGET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzYpv2kP7xp8OmLZReL1SAIsySweORn023s55e1Mi35MS_MF5h8pma3k0CCzCuQOB44Og/exec";
    var redirected = false;

    // ตรวจจับมือถือ + แท็บเล็ต + iPadOS + มือถือจอพับ (Flip/Fold)
    function isMobileOrTabletDevice() {
      var ua = navigator.userAgent || "";
      var isTouchMac = (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|Tablet|Silk|Kindle/i.test(ua);
      return isMobileUA || isTouchMac;
    }

    var detectedMode = isMobileOrTabletDevice() ? "mobile" : "desktop";

    function redirectToApp(lat, lon) {
      if (redirected) return;
      redirected = true;

      var params = new URLSearchParams(window.location.search);
      params.delete("go");
      params.delete("openExternalBrowser");

      // บังคับโหมดตามอุปกรณ์จริง (ยกเว้นลิงก์ต้นทางระบุ mode มาเจาะจงอยู่แล้ว)
      if (!params.has("mode")) {
        params.set("mode", detectedMode);
      }

      if (detectedMode === "mobile") {
        var cleanLauncher = window.location.origin + window.location.pathname;
        params.set("launcher", cleanLauncher);
        if (lat !== null && lon !== null) {
          params.set("lat", Number(lat).toFixed(6));
          params.set("lon", Number(lon).toFixed(6));
        }
      }

      window.location.replace(TARGET_WEB_APP_URL + "?" + params.toString());
    }

    (function init() {
      // ถ้าเป็นคอมพิวเตอร์ -> เด้งเข้าหน้า Desktop ทันที ไม่ต้องรอ GPS
      if (detectedMode === "desktop") {
        document.getElementById("statusTitle").textContent = "กำลังเปิดโหมดคอมพิวเตอร์...";
        redirectToApp(null, null);
        return;
      }

      // ถ้าเป็นมือถือ/แท็บเล็ต -> จับ GPS ดาวเทียมแล้วเด้งเข้าหน้า Mobile
      document.getElementById("statusTitle").textContent = "กำลังจับพิกัด GPS ดาวเทียม...";
      document.getElementById("skipBtn").style.display = "inline-block";

      if (!navigator.geolocation) {
        redirectToApp(null, null);
        return;
      }

      var guard = setTimeout(function() {
        redirectToApp(null, null);
      }, 6000);

      navigator.geolocation.getCurrentPosition(
        function(pos) {
          clearTimeout(guard);
          document.getElementById("statusTitle").textContent = "จับพิกัดสำเร็จ!";
          redirectToApp(pos.coords.latitude, pos.coords.longitude);
        },
        function() {
          clearTimeout(guard);
          redirectToApp(null, null);
        },
        { enableHighAccuracy: true, timeout: 5500, maximumAge: 0 }
      );
    })();
  </script>
</body>
</html>
